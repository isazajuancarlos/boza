[package]
name = "boza-montaje"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Orquesta el montaje de discos Linux (ext4/btrfs/xfs) en Windows para boza: monta por cuchavira, copia con boza-nucleo y desmonta. El RW es efimero por construccion (RAII: se desmonta al salir del scope, tambien si la copia falla)."

[lints]
workspace = true

[dependencies]
anyhow = "1"
boza-nucleo = { path = "../nucleo" }
# El SDK vive en el repo de cuchavira (D36: contrato y parser juntos).
cuchavira-cliente = { path = "../../../cuchavira/cliente" }
